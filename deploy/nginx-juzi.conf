# HTTP server block for juzi.
# Replace YOUR_DOMAIN with the production hostname before enabling.
# After DNS points here, run:
#   sudo certbot --nginx -d YOUR_DOMAIN
# certbot will add the SSL listen directives and certificate paths.

upstream juzi_gunicorn {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10M;

    location / {
        proxy_pass http://juzi_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
